[binaries]
c = 'clang'
ar = 'llvm-ar'
strip = 'llvm-strip'
objcopy = 'llvm-objcopy'

[host_machine]
system = 'baremetal'
cpu_family = 'arm'
cpu = 'cortex-m33'
endian = 'little'

[built-in options]
c_args = [
  '--target=arm-none-eabi',
  '-mcpu=cortex-m33',
  '-mthumb',
  '-mlittle-endian',

  # FPU/ABI per your RA6E2 line
  '-mfloat-abi=hard',
  '-mfpu=fpv5-sp-d16',

  '-ffunction-sections',
  '-fdata-sections',

  '-fno-strict-aliasing',
  '-fmessage-length=0',
  '-funsigned-char',
  '-g3',
  '-std=c99',
  '-fshort-enums',
  '-fno-unroll-loops',

  '-Wunused',
  '-Wuninitialized',
  '-Wall',
  '-Wextra',
  '-Wmissing-declarations',
  '-Wconversion',
  '-Wpointer-arith',
  '-Wshadow',
  '-Waggregate-return',
  '-Wno-parentheses-equality',
  '-Wfloat-equal',

  # Default optimization (can be overridden via -Dopt=-Os)
  '-Os']

c_link_args = [
  '--target=arm-none-eabi',
  '-mcpu=cortex-m33',
  '-mthumb',
  '-mlittle-endian',
  '-mfloat-abi=hard',
  '-mfpu=fpv5-sp-d16',
  '-Wl,--gc-sections',
  '-Wl,--icf=none',
  '-Wl,-z,norelro',
  '-lcrt0',
  '-lc++abi',]