[binaries]
c = 'clang'
ar = 'llvm-ar'
strip = 'llvm-strip'
objcopy = 'llvm-objcopy'

[host_machine]
system = 'baremetal'
cpu_family = 'arm'
cpu = 'cortex-m23'
endian = 'little'

[built-in options]
# Core toolchain + CPU identity
c_args = ['--target=arm-none-eabi',
  '-mcpu=cortex-m23',
  '-mthumb',
  '-mlittle-endian',

  # Size/sections behavior
  '-ffunction-sections',
  '-fdata-sections',

  # Matches your flags
  '-fno-strict-aliasing',
  '-fmessage-length=0',
  '-funsigned-char',
  '-g3',
  '-std=c99',
  '-fshort-enums',
  '-fno-unroll-loops',

  # Warnings (as in your RA0E1 line)
  '-Wunused',
  '-Wuninitialized',
  '-Wall',
  '-Wextra',
  '-Wmissing-declarations',
  '-Wconversion',
  '-Wpointer-arith',
  '-Wshadow',
  '-Waggregate-return',
  '-Wno-parentheses-equality',
  '-Wfloat-equal',

  # Default optimization (can be overridden via -Dopt=-Oz)
  '-Oz',]

c_link_args = [
  '--target=arm-none-eabi',
  '-mcpu=cortex-m23',
  '-mthumb',
  '-mlittle-endian',
  '-Wl,--gc-sections',
  '-Wl,--icf=none',
  '-Wl,-z,norelro',
  '-lcrt0',
  '-lc++abi',]