# Meson cross file for LLVM ATfE (Arm Toolchain for Embedded) — Cortex-M33
# Uses the LLVM-ET-Arm variant bundled with e2studio FSP v6.4.0 (ATfE-21.1.1).
# NOTE: c_args and c_link_args must be on a single line each — the Meson
# machine file parser does not accept multi-line arrays.
#
# Multilib: armv8m.main_hard_fp_unaligned_size
#   Matches: --target=arm-none-eabi -mcpu=cortex-m33 -mfloat-abi=hard -mfpu=fpv5-sp-d16
#
# --sysroot is intentionally omitted from c_link_args: lld uses the sysroot to
# find picolibc.ld as a default linker script, which then references crt0.o.
# The FSP provides its own linker script (fsp.lld) and startup (Reset_Handler).
# The sysroot is only needed at compile time for headers, not at link time.

[binaries]
c       = 'C:/Users/MyPC/AppData/Local/Programs/Renesas/RA/e2studio_v2025-12_fsp_v6.4.0/toolchains/llvm_arm/ATfE-21.1.1-Windows-x86_64/bin/clang.exe'
ar      = 'C:/Users/MyPC/AppData/Local/Programs/Renesas/RA/e2studio_v2025-12_fsp_v6.4.0/toolchains/llvm_arm/ATfE-21.1.1-Windows-x86_64/bin/llvm-ar.exe'
strip   = 'C:/Users/MyPC/AppData/Local/Programs/Renesas/RA/e2studio_v2025-12_fsp_v6.4.0/toolchains/llvm_arm/ATfE-21.1.1-Windows-x86_64/bin/llvm-strip.exe'
objcopy = 'C:/Users/MyPC/AppData/Local/Programs/Renesas/RA/e2studio_v2025-12_fsp_v6.4.0/toolchains/llvm_arm/ATfE-21.1.1-Windows-x86_64/bin/llvm-objcopy.exe'

[host_machine]
system = 'baremetal'
cpu_family = 'arm'
cpu = 'cortex-m33'
endian = 'little'

[built-in options]
c_args = ['--target=arm-none-eabi', '-mcpu=cortex-m33', '-mthumb', '-mlittle-endian', '-mfloat-abi=hard', '-mfpu=fpv5-sp-d16', '-ffunction-sections', '-fdata-sections', '-fno-strict-aliasing', '-fmessage-length=0', '-funsigned-char', '-g3', '-std=c99', '-fshort-enums', '-fno-unroll-loops', '-Wunused', '-Wuninitialized', '-Wall', '-Wextra', '-Wmissing-declarations', '-Wconversion', '-Wpointer-arith', '-Wshadow', '-Waggregate-return', '-Wno-parentheses-equality', '-Wfloat-equal', '-Os', '--sysroot=C:/Users/MyPC/AppData/Local/Programs/Renesas/RA/e2studio_v2025-12_fsp_v6.4.0/toolchains/llvm_arm/ATfE-21.1.1-Windows-x86_64/lib/clang-runtimes/arm-none-eabi']
c_link_args = ['--target=arm-none-eabi', '-mcpu=cortex-m33', '-mthumb', '-mlittle-endian', '-mfloat-abi=hard', '-mfpu=fpv5-sp-d16', '-Wl,--gc-sections', '-Wl,--icf=none', '-nodefaultlibs', '-Wl,-LC:/Users/MyPC/AppData/Local/Programs/Renesas/RA/e2studio_v2025-12_fsp_v6.4.0/toolchains/llvm_arm/ATfE-21.1.1-Windows-x86_64/lib/clang-runtimes/arm-none-eabi/armv8m.main_hard_fp_unaligned_size/lib', '-lc', '-lclang_rt.builtins']
